      - run: npm install --no-audit --no-fund
      - run: node --test test/*.test.js
      - name: Not deploying
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to this repository, then run again." && exit 1
      - name: Deploy to Cloudflare Workers
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || { echo "::error::Deployed, but no workers.dev URL was printed. Enable the workers.dev subdomain in Cloudflare."; exit 1; }
          echo "POST_URL=$url" >> "$GITHUB_ENV"
      - name: Enable wake-up notifications
        if: env.FCM_SERVICE_ACCOUNT != ''
        run: printf '%s' "$FCM_SERVICE_ACCOUNT" | npx wrangler secret put FCM_SERVICE_ACCOUNT
      - name: Check the live relay
        run: |
          node test/smoke.mjs "$POST_URL"
          echo "::notice title=NooK Post is live::$POST_URL"
