          // NooK Cloud: each person's end-to-end encrypted vault.
          //
          // The phone encrypts every object (AES-256-GCM) with a key derived from the
          // person's 12-word recovery phrase before it leaves the device. The vault is
          // addressed and signed by a separate Ed25519 key derived from the same
          // phrase, so it is not linked to the person's NooK identity, name, email
          // or phone number. Object ids are keyed hashes: the server cannot tell which
          // object is a memory, a photo or a circle, nor match them across vaults.
          //
          // What the server keeps per vault: opaque object ids, their sizes, and the
          // storage plans paid for (product id + expiry, the purchase token only as a
          // salted hash). Nothing else.

          import { HttpError, sha256Hex } from './core.js';

          export const GB = 1024 ** 3;
          export const MB = 1024 ** 2;
          export const MAX_OBJECT_BYTES = 64 * MB;
          export const MAX_OBJECTS = 200_000;
          export const LIST_LIMIT = 1000;

          /// Storage each product grants. A base plan (Premium) sets the tier; add-ons
          /// stack on top of an active base plan.
          export const VAULT_PLANS = {
            nook_premium_monthly: { base: 5 * GB },
            nook_premium_annual: { base: 50 * GB },
            nook_cloud_add_50gb: { add: 50 * GB },
            nook_cloud_add_200gb: { add: 200 * GB },
          };

          export const OBJECT_ID = /^[a-f0-9]{32}$/;

          /// Quota from the plans active at [now]. [trialBytes] is a small free
          /// allowance for trying NooK Cloud before any purchase (0 to disable).
          export function quotaOf(plans, now, trialBytes = 0) {
            let base = 0;
            let add = 0;
            for (const p of plans) {
              if (p.expires <= now) continue;
              const plan = VAULT_PLANS[p.product];
              if (!plan) continue;
              base = Math.max(base, plan.base ?? 0);
              add += plan.add ?? 0;
            }
            return Math.max(trialBytes, base > 0 ? base + add : 0);
          }

          /// One vault's bookkeeping (a Durable Object in production). Blobs live in
          /// R2 under `<vault>/<id>`; this only tracks ids, sizes and plans.
          export class VaultLogic {
            constructor(sql) {
              this.sql = sql;
              sql.exec('CREATE TABLE IF NOT EXISTS objects (id TEXT PRIMARY KEY, bytes INTEGER NOT NULL, at INTEGER NOT NULL)');
              sql.exec(
                'CREATE TABLE IF NOT EXISTS plans (token TEXT PRIMARY KEY, product TEXT NOT NULL, expires INTEGER NOT NULL)',
              );
              // Ledger rows (only used in the one ledger object): purchase → vault.
              sql.exec('CREATE TABLE IF NOT EXISTS claims (token TEXT PRIMARY KEY, vault TEXT NOT NULL)');
            }

            plans() {
              return this.sql.exec('SELECT product, expires FROM plans').toArray();
            }

            used() {
              const r = this.sql.exec('SELECT COUNT(*) AS c, COALESCE(SUM(bytes), 0) AS b FROM objects').one();
              return { count: r.c, bytes: r.b };
            }

            usage(now, trialBytes) {
              const { count, bytes } = this.used();
              return {
                used: bytes,
                count,
                quota: quotaOf(this.plans(), now, trialBytes),
                plans: this.plans().filter((p) => p.expires > now).map((p) => ({ product: p.product, expires: p.expires })),
              };
            }

            /// Whether [bytes] more fit under the quota (replacing [id] if present).
            /// Errors are returned, not thrown, so they survive Durable Object RPC.
            check(id, bytes, now, trialBytes) {
              const existing = this.sql.exec('SELECT bytes FROM objects WHERE id = ?', id).toArray()[0]?.bytes ?? 0;
              const { count, bytes: used } = this.used();
              if (!existing && count >= MAX_OBJECTS) return { error: 507 };
              const quota = quotaOf(this.plans(), now, trialBytes);
              if (used - existing + bytes > quota) return { error: quota === 0 ? 402 : 507, used, quota };
              return { ok: true };
            }

            commit(id, bytes, now) {
              this.sql.exec('INSERT OR REPLACE INTO objects (id, bytes, at) VALUES (?, ?, ?)', id, bytes, now);
            }

            has(id) {
              return this.sql.exec('SELECT 1 FROM objects WHERE id = ?', id).toArray().length > 0;
            }

            list(after, limit) {
              const rows = this.sql
                .exec('SELECT id, bytes, at FROM objects WHERE id > ? ORDER BY id LIMIT ?', after ?? '', limit + 1)
                .toArray();
              return { objects: rows.slice(0, limit), more: rows.length > limit };
            }

            remove(id) {
              this.sql.exec('DELETE FROM objects WHERE id = ?', id);
            }

            /// Every id, for wiping the vault.
            wipe() {
              const ids = this.sql.exec('SELECT id FROM objects').toArray().map((r) => r.id);
              this.sql.exec('DELETE FROM objects');
              return ids;
            }

            grant(token, product, expires) {
              this.sql.exec('INSERT OR REPLACE INTO plans (token, product, expires) VALUES (?, ?, ?)', token, product, expires);
            }

            /// Ledger: a purchase can fund exactly one vault. Returns the owner.
            claim(token, vault) {
              this.sql.exec('INSERT OR IGNORE INTO claims (token, vault) VALUES (?, ?)', token, vault);
              return this.sql.exec('SELECT vault FROM claims WHERE token = ?', token).one().vault;
            }
          }

          /// A purchase token is never stored as is: only a salted hash, enough to
          /// recognise the same purchase again.
          export const tokenHash = (platform, token) => sha256Hex(`nook-vault-token\n${platform}\n${token}`);

          export function trialBytes(env) {
            const n = Number(env.VAULT_TRIAL_BYTES ?? 0);
            return Number.isFinite(n) && n > 0 ? Math.floor(n) : 0;
          }

          export function requireObjectId(id) {
            if (!OBJECT_ID.test(id ?? '')) throw new HttpError(400, 'bad object id');
            return id;
          }
