          import assert from 'node:assert/strict';
          import { DatabaseSync } from 'node:sqlite';
          import { test } from 'node:test';

          import { b64urlEncode, sha256Hex, signingString } from '../src/core.js';
          import { handle } from '../src/router.js';
          import { HttpError } from '../src/core.js';
          import { GB, MB, VaultLogic, quotaOf } from '../src/vault.js';

          const enc = new TextEncoder();
          const T0 = Date.UTC(2026, 9, 18, 12);
          const DAY = 24 * 3600 * 1000;

          function doSql() {
            const db = new DatabaseSync(':memory:');
            return {
              exec(query, ...args) {
                const stmt = db.prepare(query);
                const rows = /^\s*(SELECT|WITH)/i.test(query) ? stmt.all(...args) : (stmt.run(...args), []);
                return { toArray: () => rows, one: () => rows[0] };
              },
            };
          }

          class Vaults {
            constructor() {
              this.all = new Map();
            }
            idFromName(n) {
              return n;
            }
            get(id) {
              if (!this.all.has(id)) this.all.set(id, new VaultLogic(doSql()));
              return this.all.get(id);
            }
          }

          class FakeR2 {
            constructor() {
              this.blobs = new Map();
            }
            async put(k, v) {
              this.blobs.set(k, new Uint8Array(v));
            }
            async get(k) {
              const v = this.blobs.get(k);
              return v ? { body: v } : null;
            }
            async delete(k) {
              for (const key of Array.isArray(k) ? k : [k]) this.blobs.delete(key);
            }
          }

          function makeEnv(extra = {}) {
            return {
              MAILBOX: null,
              VAULT: new Vaults(),
              VAULT_BLOBS: new FakeR2(),
              VAULT_TRIAL_BYTES: '0',
              VERIFY_PURCHASE: async (platform, product, token, now) => {
                if (!token.startsWith('paid')) throw new HttpError(402, 'not a purchase');
                return { product, expires: now + 30 * DAY };
              },
              ...extra,
            };
          }

          async function vaultKey() {
            const keys = await crypto.subtle.generateKey({ name: 'Ed25519' }, true, ['sign', 'verify']);
            const raw = new Uint8Array(await crypto.subtle.exportKey('raw', keys.publicKey));
            return { keys, key: b64urlEncode(raw).replace(/=+$/, '') };
          }

          async function call(who, method, path, { body, env, now = T0 } = {}) {
            const bytes = body === undefined ? new Uint8Array() : typeof body === 'string' ? enc.encode(body) : body;
            const time = String(now);
            const msg = signingString(method, path, time, await sha256Hex(bytes));
            const sig = new Uint8Array(await crypto.subtle.sign({ name: 'Ed25519' }, who.keys.privateKey, enc.encode(msg)));
            const init = { method, headers: { 'x-nook-key': who.key, 'x-nook-time': time, 'x-nook-sig': b64urlEncode(sig) } };
            if (bytes.length && method !== 'GET') init.body = bytes;
            const res = await handle(new Request(`https://post.example${path}`, init), env, null, now);
            const type = res.headers.get('content-type') ?? '';
            return { status: res.status, json: type.includes('json') ? await res.json() : null, bytes: type.includes('octet') ? new Uint8Array(await res.arrayBuffer()) : null };
          }

          const id = (n) => n.toString(16).padStart(32, '0');

          test('plans set the quota: 5 GB monthly, 50 GB annual, add-ons stack on a base plan', () => {
            const live = T0 + DAY;
            assert.equal(quotaOf([{ product: 'nook_premium_monthly', expires: live }], T0), 5 * GB);
            assert.equal(quotaOf([{ product: 'nook_premium_annual', expires: live }], T0), 50 * GB);
            assert.equal(
              quotaOf(
                [
                  { product: 'nook_premium_annual', expires: live },
                  { product: 'nook_cloud_add_50gb', expires: live },
                  { product: 'nook_cloud_add_200gb', expires: live },
                ],
                T0,
              ),
              300 * GB,
            );
            assert.equal(quotaOf([{ product: 'nook_cloud_add_200gb', expires: live }], T0), 0, 'add-ons need Premium');
            assert.equal(quotaOf([{ product: 'nook_premium_annual', expires: T0 - 1 }], T0, 25 * MB), 25 * MB, 'expired falls back to trial');
          });

          test('a vault stores, lists, returns and deletes opaque objects, within its quota', async () => {
            const env = makeEnv({ VAULT_TRIAL_BYTES: '100' });
            const me = await vaultKey();
            const blob = new Uint8Array(60).fill(9);

            assert.equal((await call(me, 'PUT', `/v1/vault/objects/${id(1)}`, { body: blob, env })).status, 201);
            const usage = await call(me, 'GET', '/v1/vault', { env });
            assert.deepEqual([usage.json.used, usage.json.count, usage.json.quota], [60, 1, 100]);

            const full = await call(me, 'PUT', `/v1/vault/objects/${id(2)}`, { body: blob, env });
            assert.equal(full.status, 507);
            assert.equal((await call(me, 'PUT', `/v1/vault/objects/${id(1)}`, { body: new Uint8Array(90), env })).status, 201, 'replacing counts once');

            const got = await call(me, 'GET', `/v1/vault/objects/${id(1)}`, { env });
            assert.equal(got.bytes.length, 90);
            assert.deepEqual((await call(me, 'GET', '/v1/vault/objects', { env })).json.objects.map((o) => o.id), [id(1)]);

            // Someone else's vault is separate, even with the same object id.
            const other = await vaultKey();
            assert.equal((await call(other, 'GET', `/v1/vault/objects/${id(1)}`, { env })).status, 404);

            assert.equal((await call(me, 'DELETE', `/v1/vault/objects/${id(1)}`, { env })).json.used, 0);
            assert.equal(env.VAULT_BLOBS.blobs.size, 0);
            assert.equal((await call(me, 'PUT', `/v1/vault/objects/not-hex`, { body: blob, env })).status, 400);
          });

          test('without a plan there is no space; a verified purchase opens it, once', async () => {
            const env = makeEnv();
            const me = await vaultKey();
            const r = await call(me, 'PUT', `/v1/vault/objects/${id(1)}`, { body: new Uint8Array(10), env });
            assert.equal(r.status, 402);

            const fake = await call(me, 'POST', '/v1/vault/plans', { body: JSON.stringify({ platform: 'android', product: 'nook_premium_monthly', token: 'forged' }), env });
            assert.equal(fake.status, 402);

            const ok = await call(me, 'POST', '/v1/vault/plans', { body: JSON.stringify({ platform: 'android', product: 'nook_premium_monthly', token: 'paid-1' }), env });
            assert.equal(ok.status, 200);
            assert.equal(ok.json.quota, 5 * GB);
            await call(me, 'POST', '/v1/vault/plans', { body: JSON.stringify({ platform: 'android', product: 'nook_cloud_add_50gb', token: 'paid-2' }), env });
            assert.equal((await call(me, 'GET', '/v1/vault', { env })).json.quota, 55 * GB);

            const thief = await vaultKey();
            const reuse = await call(thief, 'POST', '/v1/vault/plans', { body: JSON.stringify({ platform: 'android', product: 'nook_premium_monthly', token: 'paid-1' }), env });
            assert.equal(reuse.status, 409, 'one purchase funds one vault');

            // The server never keeps the raw purchase token.
            const stored = JSON.stringify([...env.VAULT.all.values()].map((v) => v.sql.exec('SELECT * FROM plans').toArray().concat(v.sql.exec('SELECT * FROM claims').toArray())));
            assert.equal(stored.includes('paid-1'), false);

            assert.equal((await call(me, 'GET', '/v1/vault', { env, now: T0 + 31 * DAY })).json.quota, 0, 'lapses with the subscription');
          });

          test('erasing a vault removes every blob', async () => {
            const env = makeEnv({ VAULT_TRIAL_BYTES: String(MB) });
            const me = await vaultKey();
            for (let i = 0; i < 5; i++) await call(me, 'PUT', `/v1/vault/objects/${id(i)}`, { body: new Uint8Array(8), env });
            assert.equal((await call(me, 'DELETE', '/v1/vault', { env })).json.erased, 5);
            assert.equal(env.VAULT_BLOBS.blobs.size, 0);
          });

          test('unsigned or tampered requests and a missing bucket are refused', async () => {
            const env = makeEnv({ VAULT_TRIAL_BYTES: '100' });
            const res = await handle(new Request('https://post.example/v1/vault', { method: 'GET' }), env, null, T0);
            assert.equal(res.status, 401);
            const me = await vaultKey();
            assert.equal((await call(me, 'GET', '/v1/vault', { env: makeEnv({ VAULT_BLOBS: undefined }) })).status, 503);
          });
          NOOK_RELAY_EOF
          cat > relay/test/smoke.mjs <<'NOOK_RELAY_EOF'
          // End-to-end check against a running NooK Post: node test/smoke.mjs <base-url>
          import assert from 'node:assert/strict';

          import { b64urlEncode, sha256Hex, signingString } from '../src/core.js';

          const base = process.argv[2] ?? 'http://localhost:8787';
          const enc = new TextEncoder();

          async function person() {
            const keys = await crypto.subtle.generateKey({ name: 'Ed25519' }, true, ['sign', 'verify']);
            const raw = new Uint8Array(await crypto.subtle.exportKey('raw', keys.publicKey));
            return {
              keys,
              key: b64urlEncode(raw).replace(/=+$/, ''),
              identity: 'nook1:' + b64urlEncode(new Uint8Array([...raw, ...new Uint8Array(32)])),
            };
          }

          async function call(who, method, path, body = '') {
            const time = String(Date.now());
            const msg = signingString(method, path, time, await sha256Hex(body));
            const sig = new Uint8Array(await crypto.subtle.sign({ name: 'Ed25519' }, who.keys.privateKey, enc.encode(msg)));
            const res = await fetch(base + path, {
              method,
              headers: { 'x-nook-key': who.key, 'x-nook-time': time, 'x-nook-sig': b64urlEncode(sig) },
              body: method === 'GET' ? undefined : body,
            });
            return { status: res.status, json: await res.json() };
          }

          const ann = await person();
          const bo = await person();
          const big = JSON.stringify({ v: 1, from: ann.identity, to: bo.identity, ct: 'x'.repeat(3_500_000) });
          assert.equal((await call(ann, 'POST', `/v1/deposit?to=${bo.key}`, big)).status, 201);
          assert.equal((await call(bo, 'PUT', '/v1/push', JSON.stringify({ token: 'not-a-real-token' }))).status, 200);
          const small = JSON.stringify({ v: 1, from: ann.identity, to: bo.identity, ct: 'hi' });
          assert.equal((await call(ann, 'POST', `/v1/deposit?to=${bo.key}`, small)).status, 201);
          const inbox = await call(bo, 'GET', '/v1/inbox');
          assert.equal(inbox.json.items.length, 2);
          assert.equal(inbox.json.items[0].env, big, '3.5 MB envelope survives chunking');
          const ack = await call(bo, 'POST', '/v1/ack', JSON.stringify({ ids: inbox.json.items.map((i) => i.id) }));
          assert.equal(ack.json.remaining, 0);
          console.log('NooK Post smoke test passed against', base);
          NOOK_RELAY_EOF
          cat > relay/package.json <<'NOOK_RELAY_EOF'
          {
            "name": "nook-post",
            "private": true,
            "type": "module",
            "devDependencies": {
              "wrangler": "4.151.1"
            }
          }
