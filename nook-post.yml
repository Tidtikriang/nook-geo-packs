          // HTTP surface of NooK Cloud. Every request is signed by the vault key
          // (derived on the phone from the recovery phrase), never by the person's
          // NooK identity, so cloud storage cannot be tied to who they talk to.
          //
          //   GET    /v1/vault                   usage, quota and active plans
          //   GET    /v1/vault/objects?after=    ids and sizes, 1000 at a time
          //   PUT    /v1/vault/objects/<id>      store one encrypted object
          //   GET    /v1/vault/objects/<id>      fetch it
          //   DELETE /v1/vault/objects/<id>      delete it
          //   POST   /v1/vault/plans             redeem a store purchase for storage
          //   DELETE /v1/vault                   erase the whole vault

          import { HttpError, verifyRequest } from './core.js';
          import { verifyPurchase } from './stores.js';
          import { LIST_LIMIT, MAX_OBJECT_BYTES, requireObjectId, tokenHash, trialBytes } from './vault.js';

          const LEDGER = '__ledger__';

          async function readBytes(request, limit) {
            const length = Number(request.headers.get('content-length') ?? 0);
            if (length > limit) throw new HttpError(413, 'too large');
            const bytes = new Uint8Array(await request.arrayBuffer());
            if (bytes.length > limit) throw new HttpError(413, 'too large');
            return bytes;
          }

          export async function handleVault(request, env, ctx, now, url, { json, banned }) {
            if (!env.VAULT || !env.VAULT_BLOBS) throw new HttpError(503, 'NooK Cloud is not switched on');
            const pathAndQuery = url.pathname + url.search;
            const putting = request.method === 'PUT';
            const body = putting ? await readBytes(request, MAX_OBJECT_BYTES) : new TextEncoder().encode(await request.text());
            if (!putting && body.length > 64 * 1024) throw new HttpError(413, 'too large');
            const caller = await verifyRequest({ method: request.method, pathAndQuery, headers: request.headers, body, now });
            if (banned(caller)) throw new HttpError(403, 'not accepted');

            const vault = env.VAULT.get(env.VAULT.idFromName(caller));
            const trial = trialBytes(env);
            const blobKey = (id) => `${caller}/${id}`;
            const parts = url.pathname.split('/').filter(Boolean); // v1, vault, objects?, id?
            const objectId = parts[2] === 'objects' && parts.length === 4 ? requireObjectId(parts[3]) : null;
            const route = `${request.method} /${parts.slice(0, 3).join('/')}${objectId ? '/:id' : ''}`;

            switch (route) {
              case 'GET /v1/vault':
                return json(await vault.usage(now, trial));

              case 'GET /v1/vault/objects': {
                const after = url.searchParams.get('after');
                if (after !== null) requireObjectId(after);
                return json(await vault.list(after, LIST_LIMIT));
              }

              case 'PUT /v1/vault/objects/:id': {
                if (body.length === 0) throw new HttpError(400, 'empty');
                const room = await vault.check(objectId, body.length, now, trial);
                if (room.error) {
                  return json({ error: room.error === 402 ? 'no storage plan' : 'vault full', used: room.used, quota: room.quota }, room.error);
                }
                await env.VAULT_BLOBS.put(blobKey(objectId), body);
                await vault.commit(objectId, body.length, now);
                return json(await vault.usage(now, trial), 201);
              }

              case 'GET /v1/vault/objects/:id': {
                const blob = await env.VAULT_BLOBS.get(blobKey(objectId));
                if (!blob) throw new HttpError(404, 'not found');
                return new Response(blob.body, { headers: { 'content-type': 'application/octet-stream', 'cache-control': 'no-store' } });
              }

              case 'DELETE /v1/vault/objects/:id':
                await env.VAULT_BLOBS.delete(blobKey(objectId));
                await vault.remove(objectId);
                return json(await vault.usage(now, trial));

              case 'POST /v1/vault/plans': {
                const { platform, product, token } = JSON.parse(new TextDecoder().decode(body) || '{}');
                const grant = await verifyPurchase(env, platform, product, token, now);
                const hashed = await tokenHash(platform, token);
                // One purchase funds one vault, so a token cannot be shared around.
                const owner = await env.VAULT.get(env.VAULT.idFromName(LEDGER)).claim(hashed, caller);
                if (owner !== caller) throw new HttpError(409, 'purchase already used by another vault');
                await vault.grant(hashed, grant.product, grant.expires);
                return json(await vault.usage(now, trial));
              }

              case 'DELETE /v1/vault': {
                const ids = await vault.wipe();
                for (let i = 0; i < ids.length; i += 1000) {
                  await env.VAULT_BLOBS.delete(ids.slice(i, i + 1000).map(blobKey));
                }
                return json({ erased: ids.length });
              }

              default:
                throw new HttpError(404, 'not found');
            }
          }
