      - run: npm install --no-audit --no-fund
      - run: node --test test/*.test.js
      - name: Not deploying
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to this repository, then run again." && exit 1
      - name: Prepare NooK Cloud storage
        run: |
          npx wrangler r2 bucket create nook-vault >/dev/null 2>&1 || true
          if npx wrangler r2 bucket list 2>/dev/null | grep -q 'nook-vault'; then
            echo "NooK Cloud bucket ready"
          else
            python3 - <<'PY'
          import re
          s = open('wrangler.toml').read()
          open('wrangler.toml', 'w').write(re.sub(r'# NOOK_CLOUD_R2_BEGIN.*?# NOOK_CLOUD_R2_END\n', '', s, flags=re.S))
          PY
            echo "::warning title=NooK Cloud is off::Turn on R2 in the Cloudflare dashboard (R2 Object Storage), then run this workflow again. NooK Post works without it."
          fi
      - name: Deploy to Cloudflare Workers
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || { echo "::error::Deployed, but no workers.dev URL was printed. Enable the workers.dev subdomain in Cloudflare."; exit 1; }
          echo "POST_URL=$url" >> "$GITHUB_ENV"
      - name: Enable wake-up notifications
        if: env.FCM_SERVICE_ACCOUNT != ''
        run: printf '%s' "$FCM_SERVICE_ACCOUNT" | npx wrangler secret put FCM_SERVICE_ACCOUNT
      - name: Store keys for NooK Cloud purchases
        run: |
          for name in GOOGLE_PLAY_SERVICE_ACCOUNT APPLE_IAP_ISSUER_ID APPLE_IAP_KEY_ID APPLE_IAP_PRIVATE_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then printf '%s' "$value" | npx wrangler secret put "$name"; fi
          done
      - name: Check the live relay
        run: |
          node test/smoke.mjs "$POST_URL"
          echo "::notice title=NooK Post is live::$POST_URL"
