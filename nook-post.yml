          // Asks Google Play or the App Store, server to server, whether a NooK
          // Cloud purchase is real and until when. The phone sends only the store's
          // opaque purchase token (Android) or transaction id (iOS): no name, no
          // email, no card, no receipt contents.
          //
          // Secrets (all optional; without them purchases cannot be redeemed):
          //   GOOGLE_PLAY_SERVICE_ACCOUNT  service-account JSON with access to the
          //                                Play Console app (Android Publisher API)
          //   APPLE_IAP_ISSUER_ID, APPLE_IAP_KEY_ID, APPLE_IAP_PRIVATE_KEY
          //                                App Store Connect "In-App Purchase" key
          // Vars: ANDROID_PACKAGE, APPLE_BUNDLE_ID.

          import { HttpError, b64urlDecode, b64urlEncode } from './core.js';
          import { VAULT_PLANS } from './vault.js';

          const enc = new TextEncoder();
          const b64json = (o) => b64urlEncode(enc.encode(JSON.stringify(o))).replace(/=+$/, '');

          function pemBody(pem) {
            const body = pem.replace(/-----[^-]+-----/g, '').replace(/\s+/g, '');
            return Uint8Array.from(atob(body), (c) => c.charCodeAt(0));
          }

          let googleToken = null; // { token, exp }

          async function googleAccess(sa, now) {
            if (googleToken && googleToken.exp - 60 > now / 1000) return googleToken.token;
            const iat = Math.floor(now / 1000);
            const unsigned = `${b64json({ alg: 'RS256', typ: 'JWT' })}.${b64json({
              iss: sa.client_email,
              scope: 'https://www.googleapis.com/auth/androidpublisher',
              aud: 'https://oauth2.googleapis.com/token',
              iat,
              exp: iat + 3600,
            })}`;
            const key = await crypto.subtle.importKey('pkcs8', pemBody(sa.private_key), { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' }, false, ['sign']);
            const sig = new Uint8Array(await crypto.subtle.sign('RSASSA-PKCS1-v1_5', key, enc.encode(unsigned)));
            const res = await fetch('https://oauth2.googleapis.com/token', {
              method: 'POST',
              headers: { 'content-type': 'application/x-www-form-urlencoded' },
              body: `grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=${unsigned}.${b64urlEncode(sig).replace(/=+$/, '')}`,
            });
            if (!res.ok) throw new HttpError(503, 'store unavailable');
            const { access_token, expires_in } = await res.json();
            googleToken = { token: access_token, exp: iat + (expires_in ?? 3600) };
            return access_token;
          }

          /// Google Play subscriptions v2: returns { product, expires } or throws 402.
          export async function verifyGoogle(env, product, token, now) {
            if (!env.GOOGLE_PLAY_SERVICE_ACCOUNT || !env.ANDROID_PACKAGE) throw new HttpError(503, 'store not configured');
            const sa = JSON.parse(env.GOOGLE_PLAY_SERVICE_ACCOUNT);
            const url =
              `https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${encodeURIComponent(env.ANDROID_PACKAGE)}` +
              `/purchases/subscriptionsv2/tokens/${encodeURIComponent(token)}`;
            const res = await fetch(url, { headers: { authorization: `Bearer ${await googleAccess(sa, now)}` } });
            if (res.status === 404 || res.status === 400 || res.status === 410) throw new HttpError(402, 'not a purchase');
            if (!res.ok) throw new HttpError(503, 'store unavailable');
            const sub = await res.json();
            const okStates = ['SUBSCRIPTION_STATE_ACTIVE', 'SUBSCRIPTION_STATE_IN_GRACE_PERIOD', 'SUBSCRIPTION_STATE_CANCELED'];
            if (!okStates.includes(sub.subscriptionState)) throw new HttpError(402, 'not active');
            const item = (sub.lineItems ?? []).find((i) => i.productId === product);
            const expires = Date.parse(item?.expiryTime ?? '');
            if (!item || !Number.isFinite(expires) || expires <= now) throw new HttpError(402, 'not active');
            return { product, expires };
          }

          async function appleJwt(env, now) {
            const iat = Math.floor(now / 1000);
            const unsigned = `${b64json({ alg: 'ES256', kid: env.APPLE_IAP_KEY_ID, typ: 'JWT' })}.${b64json({
              iss: env.APPLE_IAP_ISSUER_ID,
              iat,
              exp: iat + 600,
              aud: 'appstoreconnect-v1',
              bid: env.APPLE_BUNDLE_ID,
            })}`;
            const key = await crypto.subtle.importKey('pkcs8', pemBody(env.APPLE_IAP_PRIVATE_KEY), { name: 'ECDSA', namedCurve: 'P-256' }, false, ['sign']);
            const sig = new Uint8Array(await crypto.subtle.sign({ name: 'ECDSA', hash: 'SHA-256' }, key, enc.encode(unsigned)));
            return `${unsigned}.${b64urlEncode(sig).replace(/=+$/, '')}`;
          }

          /// App Store Server API: the transaction comes straight from Apple over
          /// TLS, so its signed payload is read without re-verifying the chain.
          export async function verifyApple(env, product, transactionId, now) {
            if (!env.APPLE_IAP_PRIVATE_KEY || !env.APPLE_IAP_KEY_ID || !env.APPLE_IAP_ISSUER_ID || !env.APPLE_BUNDLE_ID) {
              throw new HttpError(503, 'store not configured');
            }
            if (!/^\d{1,30}$/.test(transactionId)) throw new HttpError(400, 'bad transaction');
            const jwt = await appleJwt(env, now);
            let res;
            for (const host of ['api.storekit.itunes.apple.com', 'api.storekit-sandbox.itunes.apple.com']) {
              res = await fetch(`https://${host}/inApps/v1/transactions/${transactionId}`, { headers: { authorization: `Bearer ${jwt}` } });
              if (res.status !== 404) break;
            }
            if (res.status === 404 || res.status === 400) throw new HttpError(402, 'not a purchase');
            if (!res.ok) throw new HttpError(503, 'store unavailable');
            const { signedTransactionInfo } = await res.json();
            const payload = JSON.parse(new TextDecoder().decode(b64urlDecode(signedTransactionInfo.split('.')[1])));
            if (payload.bundleId !== env.APPLE_BUNDLE_ID || payload.productId !== product || payload.revocationDate) {
              throw new HttpError(402, 'not active');
            }
            const expires = Number(payload.expiresDate);
            if (!Number.isFinite(expires) || expires <= now) throw new HttpError(402, 'not active');
            return { product, expires };
          }

          export async function verifyPurchase(env, platform, product, token, now) {
            if (!VAULT_PLANS[product]) throw new HttpError(400, 'unknown product');
            if (typeof token !== 'string' || token.length < 4 || token.length > 4096) throw new HttpError(400, 'bad token');
            if (env.VERIFY_PURCHASE) return env.VERIFY_PURCHASE(platform, product, token, now); // tests
            if (platform === 'android') return verifyGoogle(env, product, token, now);
            if (platform === 'ios') return verifyApple(env, product, token, now);
            throw new HttpError(400, 'bad platform');
          }
