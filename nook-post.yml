          import assert from 'node:assert/strict';
          import { test } from 'node:test';

          import {
            CLOCK_SKEW_MS,
            MailboxLogic,
            MemoryStore,
            PUSH_QUIET_MS,
            RETENTION_MS,
            SENDER_HOURLY_LIMIT,
            b64urlEncode,
            sha256Hex,
            signingString,
          } from '../src/core.js';
          import { wakeMessage } from '../src/push.js';
          import { handle } from '../src/router.js';

          const enc = new TextEncoder();
          const T0 = Date.UTC(2026, 9, 16, 12);

          async function person() {
            const keys = await crypto.subtle.generateKey({ name: 'Ed25519' }, true, ['sign', 'verify']);
            const raw = new Uint8Array(await crypto.subtle.exportKey('raw', keys.publicKey));
            const key = b64urlEncode(raw).replace(/=+$/, '');
            const identity = 'nook1:' + b64urlEncode(new Uint8Array([...raw, ...new Uint8Array(32).fill(7)]));
            return { keys, key, identity };
          }

          function envelope(from, to, ct = 'c2VhbGVk') {
            return JSON.stringify({ v: 1, from: from.identity, to: to.identity, epk: 'AA', n: 'AA', ct, mac: 'AA', sig: 'AA' });
