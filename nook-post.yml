          class FakeNamespace {
            constructor() {
              this.boxes = new Map();
            }
            idFromName(name) {
              return name;
            }
            get(id) {
              if (!this.boxes.has(id)) this.boxes.set(id, new MailboxLogic(new MemoryStore()));
              return this.boxes.get(id);
            }
